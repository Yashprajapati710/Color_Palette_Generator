<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Color Palette Generator</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">

      <div class="header">
        <h1>Color Palette Generator</h1>

        <button id="theme-toggle" title="Toggle dark mode">
          <i class="fas fa-moon"></i>
        </button>
      </div>

      <div class="controls">
        <button id="generate-btn">
          <i class="fas fa-sync-alt"></i>
          Generate Palette
        </button>

        <div class="format-control">
          <label for="color-format">Color Format</label>

          <select id="color-format">
            <option value="hex">HEX</option>
            <option value="rgb">RGB</option>
            <option value="hsl">HSL</option>
          </select>
        </div>
      </div>

      <div class="palette-container">

        <div class="color-box">
          <div class="color" style="background-color: #e1f5fe"></div>

          <div class="color-info">
            <span class="hex-value">#E1F5FE</span>

            <div class="color-actions">
              <i
                class="fas fa-lock lock-btn"
                title="Lock color"
              ></i>

              <i
                class="far fa-copy copy-btn"
                title="Copy to clipboard"
              ></i>
            </div>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #b3e5fc"></div>

          <div class="color-info">
            <span class="hex-value">#B3E5FC</span>

            <div class="color-actions">
              <i
                class="fas fa-lock lock-btn"
                title="Lock color"
              ></i>

              <i
                class="far fa-copy copy-btn"
                title="Copy to clipboard"
              ></i>
            </div>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #81d4fa"></div>

          <div class="color-info">
            <span class="hex-value">#81D4FA</span>

            <div class="color-actions">
              <i
                class="fas fa-lock lock-btn"
                title="Lock color"
              ></i>

              <i
                class="far fa-copy copy-btn"
                title="Copy to clipboard"
              ></i>
            </div>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #4fc3f7"></div>

          <div class="color-info">
            <span class="hex-value">#4FC3F7</span>

            <div class="color-actions">
              <i
                class="fas fa-lock lock-btn"
                title="Lock color"
              ></i>

              <i
                class="far fa-copy copy-btn"
                title="Copy to clipboard"
              ></i>
            </div>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #29b6f6"></div>

          <div class="color-info">
            <span class="hex-value">#29B6F6</span>

            <div class="color-actions">
              <i
                class="fas fa-lock lock-btn"
                title="Lock color"
              ></i>

              <i
                class="far fa-copy copy-btn"
                title="Copy to clipboard"
              ></i>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
